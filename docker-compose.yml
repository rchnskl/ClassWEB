services:
  postgres:
    image: postgres:16-alpine
    container_name: classweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: classweb
      POSTGRES_PASSWORD: classweb_dev_password
      POSTGRES_DB: classweb
    ports:
      - "5432:5432"
    volumes:
      - classweb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classweb -d classweb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  classweb-pgdata:
