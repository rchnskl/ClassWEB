# Render Blueprint — provisions the ClassWeb API with one click.
# https://render.com/docs/blueprint-spec
#
# Usage: Render dashboard → New → Blueprint → connect this repo. Render reads
# this file and creates the service below automatically. You still set the
# two secret values marked `sync: false` yourself (Render prompts for them);
# everything else is pre-configured — no manual field-by-field setup needed.
services:
  - type: web
    # Renamed from `classweb-api` (Render's default region, Oregon) when moving to
    # Singapore: Render can't change an existing service's region, so this is a new
    # service. Singapore puts the API next to the Neon database (ap-southeast-1) —
    # every query used to cross the Pacific, adding ~0.2–0.5s each.
    name: classweb-api-sg
    region: singapore
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    # Liveness only (no DB query): Render probes this constantly, and a DB check
    # here would keep Neon's auto-suspending compute awake around the clock.
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Neon pooled connection string here
      - key: DIRECT_URL
        sync: false # paste your Neon DIRECT (non-pooled) connection string here — same
        # host as DATABASE_URL minus "-pooler". `prisma migrate deploy` needs a real,
        # single-session connection to hold its advisory lock for the run; over the
        # pooled endpoint the lock and its release can land on different backends,
        # which surfaces as the next deploy's migration timing out waiting on a lock
        # nothing is actually holding (P1002).
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a strong random secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: TRUST_PROXY_HOPS
        # Measured with GET /maintenance/client-ip: X-Forwarded-For arrives as
        # "client, cloudflare-edge, render-internal" over a local proxy socket,
        # so three hops are trusted to reach the real client address (and a
        # client-supplied X-Forwarded-For entry, further left, is ignored).
        value: "3"
      - key: CORS_ORIGINS
        sync: false # set to your Cloudflare Pages URL once it exists, e.g. https://classweb.pages.dev
      - key: WEB_BASE_URL
        value: https://classweb.rachanonskl-c20.workers.dev # used to build the QR/verify link on generated report PDFs
